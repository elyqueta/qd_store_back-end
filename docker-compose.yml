services:
  postgres:
    image: postgres:16-alpine
    container_name: qd_store_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qd_user
      POSTGRES_PASSWORD: qd_password
      POSTGRES_DB: qd_store
    ports:
      - '5432:5432'
    volumes:
      - qd_store_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qd_user -d qd_store']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  qd_store_postgres_data: